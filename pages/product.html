<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product – Go! Cery</title>
  <link rel="stylesheet" href="../css/main.css">
  <link rel="stylesheet" href="../css/pages.css">
  <link rel="stylesheet" href="../css/loader.css">
  <link rel="icon" href="../asset/GOCERY_LOGO_NOBG.png" type="image/x-icon">
</head>
<body>
  <div id="site-header"></div>
  <main>
    <div class="container">
      <div class="product-detail" id="product-detail"></div>
      <section class="reviews-section" id="reviews">
        <h2>Customer Reviews</h2>
        <div id="reviews-list"></div>
        <form id="review-form" class="review-form" hidden>
          <h3>Review the Product</h3>
          <div class="form-group"><label for="review-rating">Rating</label>
            <select id="review-rating" required>
              <option value="">Choose a rating</option>
              <option value="5">★★★★★ Excellent</option>
              <option value="4">★★★★☆ Good</option>
              <option value="3">★★★☆☆ Average</option>
              <option value="2">★★☆☆☆ Poor</option>
              <option value="1">★☆☆☆☆ Very poor</option>
            </select>
          </div>
          <div class="form-group"><label for="review-comment">Comment</label><textarea id="review-comment" rows="3" required></textarea></div>
          <p class="form-error" id="review-error"></p>
          <button type="submit" class="btn btn--primary">Submit Review</button>
        </form>
      </section>
      <section class="section">
        <h2>Related Products</h2>
        <div class="grid grid--4" id="related-products"></div>
      </section>
    </div>
  </main>
  <div id="site-footer"></div>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="../js/config.js"></script>
  <script src="../js/config.firebase.js"></script>
  <script src="../js/utils/storage.js"></script>
  <script src="../js/utils/format.js"></script>
  <script src="../js/utils/dom.js"></script>
  <script src="../js/data/seed.js"></script>
  <script src="../js/modules/firebase.js"></script>
  <script src="../js/modules/api.js"></script>
  <script src="../js/components/ui.js"></script>
  <script src="../js/app.js"></script>
  <script src="../js/pages/product.js"></script>
</body>
</html>
