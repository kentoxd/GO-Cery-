<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register – Go! Cery</title>
  <link rel="stylesheet" href="../css/main.css">
  <link rel="stylesheet" href="../css/pages.css">
  <link rel="stylesheet" href="../css/loader.css">
</head>
<body>
  <div id="site-header"></div>
  <main>
    <div class="auth-page">
      <div class="auth-card">
        <h1>Join Go! Cery</h1>
        <p>Create your account and start ordering palengke-fresh</p>
        <form id="register-form">
          <div class="form-group"><label>Full Name</label><input type="text" name="name" required placeholder="Juan Dela Cruz"></div>
          <div class="form-group"><label>Email</label><input type="email" name="email" required placeholder="you@email.com"></div>
          <div class="form-group"><label>Phone</label><input type="tel" name="phone" required placeholder="09XX XXX XXXX"></div>
          <div class="form-group"><label>Password</label><input type="password" name="password" required minlength="6"></div>
          <div class="form-group"><label>Confirm Password</label><input type="password" name="confirmPassword" required></div>
          <p class="form-error" id="register-error"></p>
          <button type="submit" class="btn btn--primary">Create Account</button>
        </form>
        <p class="auth-switch">Already have an account? <a href="login.html">Login</a></p>
      </div>
    </div>
  </main>
  <div id="site-footer"></div>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="../js/config.js"></script>
  <script src="../js/config.firebase.js"></script>
  <script src="../js/utils/storage.js"></script>
  <script src="../js/utils/format.js"></script>
  <script src="../js/utils/dom.js"></script>
  <script src="../js/data/seed.js"></script>
  <script src="../js/modules/firebase.js"></script>
  <script src="../js/modules/api.js"></script>
  <script src="../js/components/ui.js"></script>
  <script src="../js/app.js"></script>
  <script src="../js/pages/register.js"></script>
</body>
</html>
