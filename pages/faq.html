<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FAQs – Go! Cery</title>
  <link rel="stylesheet" href="../css/main.css">
  <link rel="stylesheet" href="../css/pages.css">
  <link rel="stylesheet" href="../css/loader.css">
</head>
<body>
  <div id="site-header"></div>
  <main>
    <section class="section">
      <div class="container">
        <div class="section__header">
          <h1>Frequently Asked Questions</h1>
          <p>Everything you need to know about ordering from Go! Cery</p>
        </div>
        <div class="faq-list" id="faq-list"></div>
      </div>
    </section>
  </main>
  <div id="site-footer"></div>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="../js/config.js"></script>
  <script src="../js/config.firebase.js"></script>
  <script src="../js/utils/storage.js"></script>
  <script src="../js/utils/format.js"></script>
  <script src="../js/utils/dom.js"></script>
  <script src="../js/data/seed.js"></script>
  <script src="../js/modules/firebase.js"></script>
  <script src="../js/modules/api.js"></script>
  <script src="../js/components/ui.js"></script>
  <script src="../js/app.js"></script>
  <script>
    App.ready().then(async () => {
      await Components.initLayout('');
      const faqs = await API.cms.getFaq();
      DOM.$('#faq-list').innerHTML = faqs.map(f => `
        <details class="faq-item">
          <summary>${DOM.escapeHtml(f.q)}</summary>
          <div class="faq-item__answer">${DOM.escapeHtml(f.a)}</div>
        </details>
      `).join('');
    });
  </script>
</body>
</html>
