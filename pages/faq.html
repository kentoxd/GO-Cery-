<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="preconnect" href="https://www.gstatic.com">
  <title>FAQs – Go! Cery</title>
  <link rel="stylesheet" href="../css/main.css">
  <link rel="stylesheet" href="../css/pages.css">
  <link rel="stylesheet" href="../css/loader.css">
  <link rel="icon" href="../asset/GOCERY_LOGO_NOBG.png" type="image/x-icon">
</head>
<body>
  <div id="site-header"></div>
  <main>
    <section class="faq-page">
      <div class="faq-page__layout">
        <aside class="faq-contact">
          <h2>Have any questions?</h2>
          <h3>Message us below</h3>
          <div class="faq-contact__email">shopwithGOCERY<br>@gmail.com</div>
        </aside>
        <div class="faq-panel">
          <div class="faq-panel__header">
            <h1>FREQUENTLY ASKED<br>QUESTIONS</h1>
            <div class="faq-panel__rule"></div>
        </div>
          <div class="faq-list" id="faq-list"></div>
        </div>
      </div>
    </section>
  </main>
  <div id="site-footer"></div>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js" defer></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js" defer></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js" defer></script>
  <script src="../js/config.js" defer></script>
  <script src="../js/config.firebase.js" defer></script>
  <script src="../js/utils/storage.js" defer></script>
  <script src="../js/utils/format.js" defer></script>
  <script src="../js/utils/dom.js" defer></script>
  <script src="../js/data/seed.js" defer></script>
  <script src="../js/modules/firebase.js" defer></script>
  <script src="../js/modules/api.js" defer></script>
  <script src="../js/components/ui.js" defer></script>
  <script src="../js/app.js" defer></script>
  <script>
  document.addEventListener('DOMContentLoaded', () => {      App.ready().then(async () => {
        await Components.initLayout('');
        const faqs = await API.cms.getFaq();
        DOM.$('#faq-list').innerHTML = faqs.map(f => `
          <details class="faq-item">
            <summary>${DOM.escapeHtml(f.q)}</summary>
            <div class="faq-item__answer">${DOM.escapeHtml(f.a)}</div>
          </details>
        `).join('');
      });
    });
</script>
</body>
</html>
