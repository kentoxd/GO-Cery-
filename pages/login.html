<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login – Go! Cery</title>
  <link rel="stylesheet" href="../css/main.css">
  <link rel="stylesheet" href="../css/pages.css">
  <link rel="stylesheet" href="../css/loader.css">
</head>
<body>
  <div id="site-header"></div>
  <main>
    <div class="auth-page">
      <div class="auth-card">
        <h1>Welcome Back, Suki!</h1>
        <p>Login to your Go! Cery account</p>
        <form id="login-form">
          <div class="form-group"><label>Email</label><input type="email" name="email" required placeholder="you@email.com"></div>
          <div class="form-group">
            <label>Password</label>
            <div class="password-field">
              <input type="password" name="password" required placeholder="Your password">
              <button type="button" class="password-toggle" aria-label="Show password">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
              </button>
            </div>
          </div>
          <p class="form-error" id="login-error"></p>
          <button type="submit" class="btn btn--primary">Login</button>
        </form>

        <div class="auth-divider">or continue with</div>
        <button type="button" class="btn btn--google" id="google-login" aria-label="Sign in with Google">
          <svg width="18" height="18" viewBox="0 0 48 48" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>
          Continue with Google
        </button>

        <p class="auth-switch">Don't have an account? <a href="register.html">Register</a></p>
      </div>
    </div>
  </main>
  <div id="site-footer"></div>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="../js/config.js"></script>
  <script src="../js/config.firebase.js"></script>
  <script src="../js/utils/storage.js"></script>
  <script src="../js/utils/format.js"></script>
  <script src="../js/utils/dom.js"></script>
  <script src="../js/utils/password-toggle.js"></script>
  <script src="../js/data/seed.js"></script>
  <script src="../js/modules/firebase.js"></script>
  <script src="../js/modules/api.js"></script>
  <script src="../js/components/ui.js"></script>
  <script src="../js/app.js"></script>
  <script src="../js/pages/login.js"></script>
</body>
</html>
