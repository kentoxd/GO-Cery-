<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="preconnect" href="https://www.gstatic.com">
  <title>Shop – Go! Cery</title>
  <link rel="stylesheet" href="../css/main.css">
  <link rel="stylesheet" href="../css/pages.css">
  <link rel="stylesheet" href="../css/loader.css">
  <link rel="icon" href="../asset/GOCERY_LOGO_NOBG.png" type="image/x-icon">
</head>
<body>
  <div id="site-header"></div>
  <main>
    <div class="container shop-page">
      <section class="shop-banner shop-banner--all" id="shop-banner" aria-label="Shop banner">
        <div class="shop-banner__image shop-banner__image--left" id="shop-banner-image-left"></div>
        <div class="shop-banner__content">
          <p class="shop-banner__eyebrow" id="shop-banner-eyebrow">Palengke-fresh picks</p>
          <h1 id="shop-banner-title">Shop Daily</h1>
          <p id="shop-banner-subtitle">Fresh choices delivered to your doorstep.</p>
        </div>
        <div class="shop-banner__image shop-banner__image--right" id="shop-banner-image-right"></div>
      </section>
      <div class="shop-layout">
        <aside class="shop-sidebar" id="shop-sidebar"></aside>
        <div>
        <div class="shop-toolbar">
          <h1>Shop <small id="product-count" style="font-weight:400;color:var(--color-text-muted)"></small></h1>
        </div>
        <div class="grid grid--3" id="products-grid"></div>
        </div>
      </div>
    </div>
  </main>
  <div id="site-footer"></div>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js" defer></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js" defer></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js" defer></script>
  <script src="../js/config.js" defer></script>
  <script src="../js/config.firebase.js" defer></script>
  <script src="../js/utils/storage.js" defer></script>
  <script src="../js/utils/format.js" defer></script>
  <script src="../js/utils/dom.js" defer></script>
  <script src="../js/data/seed.js" defer></script>
  <script src="../js/modules/firebase.js" defer></script>
  <script src="../js/modules/api.js" defer></script>
  <script src="../js/components/ui.js" defer></script>
  <script src="../js/app.js" defer></script>
  <script src="../js/pages/shop.js" defer></script>
</body>
</html>
